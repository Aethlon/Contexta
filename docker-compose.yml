services:
  # â”€â”€â”€ Infra â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-contexta}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contexta"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # â”€â”€â”€ Python Backend â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  migration:
    build: .
    environment:
      MODE: migrate
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  model-server:
    build:
      context: .
      target: model-server
    environment:
      MODE: model-server
      MODEL_SERVER_PORT: 8001
      MODEL_CACHE_DIR: /app/models
      HF_HOME: /app/models/.cache
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_MODEL_SERVER_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_MODEL: ${CONTEXTA_MODEL_SERVER_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      CONTEXTA_EMBEDDING_DIMENSIONS: 1024
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  inference-server:
    build: .
    # Not profile-gated: this serves the fine-tuned extractor, which is the
    # default extraction path. The worker degrades to a low-quality regex
    # assembler if it is down, so it is a normal dependency rather than a
    # hard one.
    environment:
      MODE: inference-server
      CONTEXTA_INFERENCE_OLLAMA_URL: http://host.docker.internal:11434
      CONTEXTA_INFERENCE_MODEL: ${CONTEXTA_INFERENCE_MODEL:-contexta-lfm-extract}
      CONTEXTA_INFERENCE_NUM_CTX: ${CONTEXTA_INFERENCE_NUM_CTX:-16384}
      CONTEXTA_INFERENCE_NUM_PREDICT: ${CONTEXTA_INFERENCE_NUM_PREDICT:-4096}
    ports:
      - "${CONTEXTA_INFERENCE_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:

    build: .
    environment:
      MODE: api
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
      CONTEXTA_SECRET_KEY: ${CONTEXTA_SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CONTEXTA_ENGINE_MODE: offline
      CONTEXTA_LLM_PROVIDER: local
      CONTEXTA_LLM_BASE_URL: ""
      CONTEXTA_LLM_MODEL: ${CONTEXTA_LLM_MODEL:-contexta-lfm-extract}
      CONTEXTA_INFERENCE_SERVER_URL: http://inference-server:8002
      CONTEXTA_LLM_API_KEY: ""
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_PROVIDER: local
      CONTEXTA_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      CONTEXTA_EMBEDDING_VERSION: qwen3-embedding-0.6b-v1
      CONTEXTA_EMBEDDING_DIMENSIONS: 1024
      CONTEXTA_EMBEDDING_API_KEY: ""
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      MODEL_CACHE_DIR: /app/models
      CONTEXTA_ARTIFACT_STORAGE_BACKEND: local
      CONTEXTA_ARTIFACT_STORAGE_PATH: /app/data/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - artifact-data:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    restart: unless-stopped

  # â”€â”€â”€ Next.js Dashboard â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      CONTEXTA_API_URL: http://api:8000
      # Inside the compose network the MCP server is reachable by service name.
      # Without this the console's health check falls back to localhost:8765,
      # which resolves to the dashboard container itself, so the MCP status
      # always reads "offline" even when the server is healthy.
      CONTEXTA_MCP_URL: http://mcp:8765
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-key-change-in-prod}
      CONTEXTA_DASHBOARD_AUTH: ${CONTEXTA_DASHBOARD_AUTH:-off}
      CONTEXTA_DASHBOARD_API_KEY: ${CONTEXTA_DASHBOARD_API_KEY:-}
      # Which models this deployment uses. Not secrets — this is how the console
      # can still name the extractor and embedding profile when it has no API key
      # to read live telemetry with.
      CONTEXTA_LLM_MODEL: ${CONTEXTA_LLM_MODEL:-contexta-lfm-extract}
      CONTEXTA_LLM_PROVIDER: ${CONTEXTA_LLM_PROVIDER:-local}
      CONTEXTA_EMBEDDING_MODEL: ${CONTEXTA_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_DIMENSIONS: ${CONTEXTA_EMBEDDING_DIMENSIONS:-1024}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
      mcp:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    environment:
      MODE: worker
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
      CONTEXTA_ENGINE_MODE: offline
      CONTEXTA_LLM_PROVIDER: local
      CONTEXTA_LLM_BASE_URL: ""
      CONTEXTA_LLM_MODEL: ${CONTEXTA_LLM_MODEL:-contexta-lfm-extract}
      CONTEXTA_INFERENCE_SERVER_URL: http://inference-server:8002
      CONTEXTA_LLM_API_KEY: ""
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_PROVIDER: local
      CONTEXTA_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      CONTEXTA_EMBEDDING_VERSION: qwen3-embedding-0.6b-v1
      CONTEXTA_EMBEDDING_DIMENSIONS: 1024
      CONTEXTA_EMBEDDING_API_KEY: ""
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      MODEL_CACHE_DIR: /app/models
      CONTEXTA_ARTIFACT_STORAGE_BACKEND: local
      CONTEXTA_ARTIFACT_STORAGE_PATH: /app/data/artifacts
    volumes:
      - ./models:/app/models
      - artifact-data:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      model-server:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    environment:
      MODE: beat
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_PROVIDER: local
      CONTEXTA_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      CONTEXTA_EMBEDDING_VERSION: qwen3-embedding-0.6b-v1
      CONTEXTA_EMBEDDING_DIMENSIONS: 1024
      CONTEXTA_EMBEDDING_API_KEY: ""
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # â”€â”€â”€ Go Services â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # The Go gateway is retired as a second entry point. It duplicated API-key
  # verification (Redis-only, with no Postgres fallback) and forced two ways to
  # reach the same route. TLS termination belongs on the load balancer or reverse
  # proxy in front of the API. The edge capabilities it provided - response cache,
  # single-flight, per-key rate limiting - now live in the Python API as
  # contexta/api/middleware/{response_cache,ratelimit}.py.
  #
  # To re-enable it: `docker compose --profile edge up gateway`
  gateway:
    build: ./services/gateway
    profiles: ["edge"]
    environment:
      REDIS_ADDR: redis:6379
      PYTHON_API_URL: http://api:8000
      LISTEN_ADDR: :8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  mcp:
    build: .
    environment:
      MODE: mcp
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_EMBEDDING_PROFILE: ${CONTEXTA_EMBEDDING_PROFILE:-offline-qwen3-1024}
      CONTEXTA_EMBEDDING_PROVIDER: local
      CONTEXTA_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B
      CONTEXTA_EMBEDDING_VERSION: qwen3-embedding-0.6b-v1
      CONTEXTA_EMBEDDING_DIMENSIONS: 1024
      CONTEXTA_EMBEDDING_API_KEY: ""
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      # MCP authenticates every caller with a Contexta API key and scopes writes to
      # that key's tenant. Set CONTEXTA_MCP_ALLOW_ANONYMOUS=true only for a local
      # single-tenant experiment - never for a shared or exposed deployment.
      CONTEXTA_MCP_API_KEY: ${CONTEXTA_MCP_API_KEY:-}
      CONTEXTA_MCP_ALLOW_ANONYMOUS: ${CONTEXTA_MCP_ALLOW_ANONYMOUS:-false}
      CONTEXTA_MCP_RATE_PER_SECOND: ${CONTEXTA_MCP_RATE_PER_SECOND:-20}
      CONTEXTA_MCP_RATE_BURST: ${CONTEXTA_MCP_RATE_BURST:-40}
      # Bulk import guards. Leave CONTEXTA_MCP_ALLOWED_ROOTS unset to confine
      # file_path to the working directory; set CONTEXTA_MCP_ALLOWED_FETCH_HOSTS to a
      # comma-separated allowlist to permit file_url at all.
      CONTEXTA_MCP_ALLOWED_ROOTS: ${CONTEXTA_MCP_ALLOWED_ROOTS:-}
      CONTEXTA_MCP_ALLOWED_FETCH_HOSTS: ${CONTEXTA_MCP_ALLOWED_FETCH_HOSTS:-}
      MODEL_CACHE_DIR: /app/models
    ports:
      - "8765:8765"
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      model-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  model-cache:
  artifact-data:
