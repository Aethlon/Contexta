services:
  # ─── Infra ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-contexta}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contexta"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Python Backend ─────────────────────────────────
  migration:
    build: .
    environment:
      MODE: migrate
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  model-server:
    build: .
    environment:
      MODE: model-server
      MODEL_SERVER_PORT: 8001
      MODEL_CACHE_DIR: /app/models
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped


  api:
    build: .
    environment:
      MODE: api
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
      CONTEXTA_SECRET_KEY: ${CONTEXTA_SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      CONTEXTA_ENGINE_MODE: ${CONTEXTA_ENGINE_MODE:-offline}
      CONTEXTA_LLM_PROVIDER: ${CONTEXTA_LLM_PROVIDER:-local}
      CONTEXTA_LLM_BASE_URL: ${CONTEXTA_LLM_BASE_URL:-}
      CONTEXTA_LLM_MODEL: ${CONTEXTA_LLM_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      CONTEXTA_LLM_API_KEY: ${CONTEXTA_LLM_API_KEY:-}
      CONTEXTA_EMBEDDING_PROVIDER: ${CONTEXTA_EMBEDDING_PROVIDER:-local}
      CONTEXTA_EMBEDDING_MODEL: ${CONTEXTA_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      CONTEXTA_EMBEDDING_DIMENSIONS: ${CONTEXTA_EMBEDDING_DIMENSIONS:-1024}
      CONTEXTA_EMBEDDING_API_KEY: ${CONTEXTA_EMBEDDING_API_KEY:-}
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      MODEL_CACHE_DIR: /app/models
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    restart: unless-stopped

  # ─── Next.js Dashboard ─────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      CONTEXTA_API_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-key-change-in-prod}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    environment:
      MODE: worker
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
      CONTEXTA_ENGINE_MODE: ${CONTEXTA_ENGINE_MODE:-offline}
      CONTEXTA_LLM_PROVIDER: ${CONTEXTA_LLM_PROVIDER:-local}
      CONTEXTA_LLM_BASE_URL: ${CONTEXTA_LLM_BASE_URL:-}
      CONTEXTA_LLM_MODEL: ${CONTEXTA_LLM_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      CONTEXTA_LLM_API_KEY: ${CONTEXTA_LLM_API_KEY:-}
      CONTEXTA_EMBEDDING_PROVIDER: ${CONTEXTA_EMBEDDING_PROVIDER:-local}
      CONTEXTA_EMBEDDING_MODEL: ${CONTEXTA_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      CONTEXTA_EMBEDDING_DIMENSIONS: ${CONTEXTA_EMBEDDING_DIMENSIONS:-1024}
      CONTEXTA_EMBEDDING_API_KEY: ${CONTEXTA_EMBEDDING_API_KEY:-}
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      MODEL_CACHE_DIR: /app/models
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      model-server:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    environment:
      MODE: beat
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_REDIS_URL: redis://redis:6379/0
      CONTEXTA_CELERY_BROKER_URL: redis://redis:6379/1
      CONTEXTA_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CONTEXTA_CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # ─── Go Services ────────────────────────────────────
  gateway:
    build: ./services/gateway
    environment:
      REDIS_ADDR: redis:6379
      DATA_PLANE_URL: http://data-plane:8080
      PYTHON_API_URL: http://api:8000
      LISTEN_ADDR: :8443
      TLS_CERT_FILE: /certs/cert.pem
      TLS_KEY_FILE: /certs/key.pem
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  mcp:
    build: .
    environment:
      MODE: mcp
      CONTEXTA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      CONTEXTA_LOCAL_MODEL_SERVER_URL: http://model-server:8001
      MODEL_CACHE_DIR: /app/models
    ports:
      - "8765:8765"
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      model-server:
        condition: service_healthy
    restart: unless-stopped

  data-plane:
    build: ./services/data-plane
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contexta}
      LISTEN_ADDR: :8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  model-cache:
