[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexta-anthropic"
version = "0.1.0"
description = "contexta memory adapter for Anthropic Claude SDK"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "contexta-client>=0.1.0",
    "anthropic>=0.50",
]

[project.urls]
Homepage = "https://github.com/anomalyco/contexta"
