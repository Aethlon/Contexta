[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexta-openai"
version = "0.1.0"
description = "contexta memory adapter for OpenAI Assistants API"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "contexta-client>=0.1.0",
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/anomalyco/contexta"
