[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexta-langchain"
version = "0.1.0"
description = "contexta memory adapter for LangChain"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "contexta-client>=0.1.0",
    "langchain>=0.3",
]

[project.urls]
Homepage = "https://github.com/anomalyco/contexta"
