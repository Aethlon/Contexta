[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexta"
version = "1.5.0"
description = "Contexta - Memory Intelligence Engine for AI Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    "pgvector==0.3.6",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "structlog==24.3.0",
    "sentry-sdk[fastapi]==2.19.2",
    "pyjwt==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "httpx==0.28.1",
    "email-validator==2.2.0",
    "huggingface-hub>=0.23.0",
    "aiosqlite>=0.22.1",
    "mcp>=1.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
# Qwen3 embedding + reranking run only inside the model-server container, so the
# CPU Torch/sentence-transformers stack is kept out of the shared runtime image.
model-server = [
    "torch==2.6.0",
    "sentence-transformers==3.4.1",
    "accelerate==1.4.0",
]
dev = [
    "hypothesis==6.119.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    # tests/test_model_server.py and tests/test_model_server_auto_download.py
    # exercise the real SentenceTransformer load path and refuse to serve without
    # it, so the model-server stack is part of running the suite, not just of
    # building the model-server image.
    "contexta[model-server]==0.1.0",
]

# Torch is resolved from the CPU-only wheel index. The default PyPI `torch` wheel
# drags in the CUDA runtime (~2.5 GB of nvidia-* packages) even on a CPU-only
# model-server image, so the extra would silently bloat every build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["contexta"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# DTZ003/DTZ011: naive-UTC timestamps in the persisted layer (models/repos) —
# intentional pending a schema migration to timezone-aware columns.
# RUF012: pydantic mutable defaults are the project convention.
ignore = ["DTZ003", "DTZ011", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls in defaults are idiomatic.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.security.HTTPBearer",
  "fastapi.security.OAuth2PasswordBearer",
]
